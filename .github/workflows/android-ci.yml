name: Android Mock CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android mock build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK and unit tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Report APK location
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "Android Mock APK built for commit ${GITHUB_SHA}"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 예외적 사전 병합 QA: Mock APK 1개 + 정확한 빌드 SHA / SHA-256만 단기 보관.
      # 정식 릴리스와 분리하며, 서명된 운영 배포물로 취급하지 않는다.
      - name: Prepare bounded QA package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-output
          cp app/build/outputs/apk/debug/app-debug.apk qa-output/ai-usage-android-mock.apk
          printf '%s\n' "$GITHUB_REPOSITORY" > qa-output/source-repository.txt
          printf '%s\n' "$GITHUB_SHA" > qa-output/source-commit.txt
          (cd qa-output && sha256sum ai-usage-android-mock.apk > SHA256SUMS)
          test -s qa-output/ai-usage-android-mock.apk
          (cd qa-output && sha256sum -c SHA256SUMS)

      - name: Upload Android Mock APK for bounded QA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-usage-android-mock-${{ github.sha }}
          path: apps/android/qa-output/
          if-no-files-found: error
          retention-days: 3
