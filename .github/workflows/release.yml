name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_ASSET_NAME: ai-usage.exe

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Generate app icons
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/generate_icons.py

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ai-usage.exe dist/ai-usage.exe
          # Compatibility alias for Codex Usage versions that still request the old asset name.
          Copy-Item target/release/ai-usage.exe dist/codex-usage.exe
          Copy-Item scripts/install.ps1 dist/install.ps1
          Copy-Item scripts/uninstall.ps1 dist/uninstall.ps1

          $hash = (Get-FileHash -Algorithm SHA256 dist/ai-usage.exe).Hash.ToLowerInvariant()
          "$hash  ai-usage.exe" | Set-Content -Encoding ascii dist/ai-usage.exe.sha256
          "$hash  codex-usage.exe" | Set-Content -Encoding ascii dist/codex-usage.exe.sha256

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/ai-usage.exe
            dist/ai-usage.exe.sha256
            dist/codex-usage.exe
            dist/codex-usage.exe.sha256
            dist/install.ps1
            dist/uninstall.ps1
          generate_release_notes: true
